kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - "reset my password"
      - "I forgot my password"
      - "my password expired"
      - "can't log in, password issue"
  actions:
    - kind: SendActivity
      id: greet
      activity: "I can help with that. Let's verify a couple of things first."

    - kind: Question
      id: askUpn
      variable: Topic.UserPrincipalName
      prompt: "What's the email address / username on the account?"
      entity: StringPrebuiltEntity

    - kind: InvokeFlowAction
      id: identityLookup
      flowId: "flow://identity-lookup-and-reset"
      input:
        userPrincipalName: =Topic.UserPrincipalName
      output:
        binding:
          identityFound: Topic.IdentityFound
          resetTriggered: Topic.ResetTriggered
          ticketId: Topic.TicketId

    - kind: ConditionGroup
      id: branchOnIdentity
      conditions:
        - id: identityFound
          condition: =Topic.IdentityFound = true
          actions:
            - kind: SendActivity
              activity: "Done — a password reset link has been sent to your registered recovery email. Reference ticket **{Topic.TicketId}**."
      elseActions:
        - kind: SendActivity
          activity: "I couldn't verify that account. I'll hand this over to a person and log a ticket so it's not lost."
        - kind: InvokeFlowAction
          id: createEscalationTicket
          flowId: "flow://create-ticket"
          input:
            topic: "Password Reset"
            status: "Open"
            transcriptLink: =System.Conversation.Id
        - kind: BeginDialog
          dialog: EscalateToAgent

# --- Reference metadata (not part of the runtime schema, kept for portfolio documentation) ---
referenceInfo:
  triggerPhrases:
    - "reset my password"
    - "I forgot my password"
    - "my password expired"
    - "can't log in, password issue"
  actionsUsed:
    - "Power Automate action: identity-lookup-and-reset (Entra ID lookup + trigger reset)"
    - "Power Automate action: create-ticket (Dataverse)"
  dataverseWriteOn:
    resolved: "Status = Resolved"
    escalated: "Status = Open"
